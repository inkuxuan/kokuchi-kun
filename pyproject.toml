[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kokuchi-kun"
version = "4.2.0"

description = "Discord bot to schedule VRChat group announcements"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "inkutech", email = "mail@inkutech.jp"}
]

dependencies = [
    "discord.py>=2.3.0",
    "openai>=1.0.0",
    "PyYAML>=6.0",
    "APScheduler>=3.10.0",
    "vrchatapi==1.20.7",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "python-dateutil>=2.9.0.post0",
    "google-cloud-firestore>=2.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
]
